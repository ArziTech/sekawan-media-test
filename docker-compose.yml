services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sekawan_app
    restart: unless-stopped
    working_dir: /var/www/backend
    environment:
      APP_NAME: "Nickel Mine Fleet Management"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://link-app.gunawan05.pro
      APP_KEY: base64:UjGTppfA2+yr5h2QSBDOgLGyW8v6vcEXn4zxbfUvgWA=
      DB_CONNECTION: mysql
      DB_HOST: sekawan_db
      DB_PORT: 3306
      DB_DATABASE: sekawan_mine_fleet
      DB_USERNAME: sekawan
      DB_PASSWORD: secretpassword
      PHP_CLI_SERVER_WORKERS: 4
    depends_on:
      - db
    networks:
      - rasava-network

  db:
    image: mysql:8.0
    container_name: sekawan_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --performance_schema=OFF --innodb_buffer_pool_size=64M --max_connections=30
    environment:
      MYSQL_DATABASE: sekawan_mine_fleet
      MYSQL_USER: sekawan
      MYSQL_PASSWORD: secretpassword
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - rasava-network

networks:
  rasava-network:
    external: true

volumes:
  mysql_data:
    driver: local
