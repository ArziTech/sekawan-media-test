services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sekawan_app
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
      - ./frontend:/var/www/frontend
    networks:
      - sekawan_net
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: sekawan_mine_fleet
      DB_USERNAME: sekawan
      DB_PASSWORD: secretpassword

  db:
    image: mysql:8.0
    container_name: sekawan_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sekawan_mine_fleet
      MYSQL_USER: sekawan
      MYSQL_PASSWORD: secretpassword
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - sekawan_net

  web:
    image: nginx:alpine
    container_name: sekawan_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/backend
      - ./frontend:/var/www/frontend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
      - db
    networks:
      - sekawan_net

networks:
  sekawan_net:
    driver: bridge

volumes:
  mysql_data:
    driver: local
